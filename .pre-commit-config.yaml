# ==============================================================================
# See https://pre-commit.com            for more information
# See https://pre-commit.com/hooks.html for more hooks
# ==============================================================================
default_language_version:
  golang: "1.24.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.0.0
    hooks:
    -   id: check-merge-conflict
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
  # Bash helper hooks (local)
  #
  - repo: local
    hooks:
      # shellcheck (aliased to shck)
      #
      - id: shellcheck
        name: Run static analysis (shellcheck)
        entry: shellcheck
        language: system
        files: \.(sh|bash)$
        types: [file]
        alias: shck
        args: [ '-x', '-P', 'SCRIPTDIR', '-e', 'SC2034' ]
      # shfmt
      #
      - id: shfmt
        name: Auto-format shell scripts (shfmt -w)
        entry: shfmt
        language: system
        files: \.(sh|bash)$
        types: [file]
        # Use write mode (-w) so this hook behaves like other auto-fixers
        args: [ '-i', '0', '-ci', '-sr', '-kp', '-w' ]
      # Uses pre-commit's Go toolchain (see default_language_version), not host `go`.
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: golang
        language_version: "1.24.0"
        pass_filenames: false
        files: '(go\.mod|go\.sum|.*\.go)$'
